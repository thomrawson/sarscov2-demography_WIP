script: script.R

parameters:
  deterministic:
      default: false
  assumptions:
    default: "central"
  population_year:
    default: 2019
  vaccine_assumptions:
    default: "baseline"
  param_iterations:
    default: 100
  
  
artefacts:
  - staticgraph:
      description: supplementary figures
      filenames:
        - Fig3.png
        - Fig3.pdf

packages:
  - sircovid
  - spimalot
  - tidyr
  - dplyr
  - forcats
  - magrittr
  - ggplot2
  - scales
  - cowplot
  - slider
  - lubridate
  
global_resources:
  global_util.R: rtm_inference/util_new.R
  
resources:
  - plotting_functions.R

depends:
  - 01_parsed_data:
      id: latest
      use:
        england_region_data.csv: outputs/england_region_data.csv
  - 02_parameters:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_assumptions == "ONS_NHS_region_principal" && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        dependencies/baseline_central.rds: parameters_base.rds
  - 02_parameters:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_assumptions == "ONS_NHS_region_low_migration" && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        dependencies/baseline_low_migration.rds: parameters_base.rds
  - 02_parameters:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_assumptions == "ONS_NHS_region_high_migration" && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        dependencies/baseline_high_migration.rds: parameters_base.rds
  - Fig2_Health_Outcomes:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        simulation_data.rds: Figure_dataframes/simulation_data.rds
  - 02_parameters:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_assumptions == "ONS_NHS_region_principal" && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        vaccine_dependencies/base.rds: parameters_base.rds
  - 05_combine_vaccinations:
      id: latest(parameter:assumptions == assumptions && parameter:param_iterations == 200 && parameter:deterministic == deterministic && parameter:population_assumptions == "ONS_NHS_region_principal" && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        vaccine_dependencies/vaccine_simulations.rds: combined_vaccination_dataframe.rds
        vaccine_dependencies/vaccine_schedules.rds: vaccine_schedules.rds
  - 05_combine_vaccinations:
      id: latest(parameter:assumptions == assumptions && parameter:param_iterations == 200 && parameter:deterministic == deterministic && parameter:population_assumptions == "rtm_baseline" && parameter:population_year == 2019 && parameter:vaccine_assumptions == "baseline")
      use:
        vaccine_dependencies/baseline_vaccine_simulations.rds: combined_vaccination_dataframe.rds
        vaccine_dependencies/baseline_vaccine_schedules.rds: vaccine_schedules.rds