script: script.R

parameters:
  population_assumptions:
    default: "ONS_NHS_region_principal"
  
artefacts:
  - data:
      description: dataframe used for plots
      filenames:
        - pop_wide.rds
  - staticgraph:
      description: supplementary figures
      filenames:
        - England_population.png
        - regional_plots/london_population.png
        - regional_plots/south_east_population.png
        - regional_plots/south_west_population.png
        - regional_plots/midlands_population.png
        - regional_plots/north_east_and_yorkshire_population.png
        - regional_plots/east_of_england_population.png
        - regional_plots/north_west_population.png
        - regional_plots/england_population.png
        - regional_pct_changes_grid.png

packages:
  - sircovid
  - spimalot
  - tidyr
  - dplyr
  - forcats
  - magrittr
  - ggplot2
  - scales
  - cowplot

depends:
  - 00_population_projections:
      id: latest
      use:
        ONS_population_projections.rds: outputs/ONS_population_projections.rds
