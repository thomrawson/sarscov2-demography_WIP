script: script.R

parameters:
  deterministic:
      default: false
  assumptions:
    default: "central"
  population_assumptions:
    default: "ONS_NHS_region_principal"
  population_year:
    default: 2019
  vaccine_assumptions:
    default: "baseline"
  param_iterations:
    default: 100
  
  
artefacts:
  - staticgraph:
      description: supplementary figures
      filenames:
        - england_plots/admitted_inc.png

packages:
  - sircovid
  - spimalot
  - tidyr
  - dplyr
  - forcats
  - magrittr
  - ggplot2
  - scales
  - cowplot
  
global_resources:
  global_util.R: rtm_inference/util_new.R

depends:
  - 01_parsed_data:
      id: latest
      use:
        england_region_data.csv: outputs/england_region_data.csv
  - 02_parameters:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        base.rds: parameters_base.rds
  - 04_combine_simulations:
      id: latest(parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        combined_output_dataframe.rds: combined_output_dataframe.rds
        index_names.rds: index_names.rds
  - 04_combine_simulations:
      id: latest(parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == "rtm_baseline" && parameter:population_year == 2019 && parameter:vaccine_assumptions == "baseline")
      use:
        baseline_combined_output_dataframe.rds: combined_output_dataframe.rds
        baseline_index_names.rds: index_names.rds