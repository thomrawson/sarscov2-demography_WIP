script: script.R

parameters:
  deterministic:
      default: false
  assumptions:
    default: "central"
  population_assumptions:
    default: "ONS_NHS_region_principal"
  population_year:
    default: 2019
  vaccine_assumptions:
    default: "baseline"
  param_iterations:
    default: 100
  
artefacts:
  - data:
      description: dataframe used for plots
      filenames:
        - pop_wide.rds
  - staticgraph:
      description: supplementary figures
      filenames:
        - England_population.png
        - NHS_pct_change_map.png
        - Fig1.png
        - Fig1_w_vaccs.png
        - regional_plots/london_population.png
        - regional_plots/south_east_population.png
        - regional_plots/south_west_population.png
        - regional_plots/midlands_population.png
        - regional_plots/north_east_and_yorkshire_population.png
        - regional_plots/east_of_england_population.png
        - regional_plots/north_west_population.png
        - regional_plots/england_population.png
        - regional_pct_changes_grid.png

packages:
  - sircovid
  - spimalot
  - tidyr
  - dplyr
  - lubridate
  - stringr
  - forcats
  - magrittr
  - ggplot2
  - scales
  - cowplot
  - sf
  - viridis
  - ggrepel
  - ggspatial
  - ggsci
  - patchwork
  
resources:
  - NHS_region_shp_files/NHSER_DEC_2023_EN_BGC.cpg
  - NHS_region_shp_files/NHSER_DEC_2023_EN_BGC.dbf
  - NHS_region_shp_files/NHSER_DEC_2023_EN_BGC.prj
  - NHS_region_shp_files/NHSER_DEC_2023_EN_BGC.shp
  - NHS_region_shp_files/NHSER_DEC_2023_EN_BGC.shp.xml
  - NHS_region_shp_files/NHSER_DEC_2023_EN_BGC.shx

depends:
  - 00_population_projections:
      id: latest
      use:
        ONS_population_projections.rds: outputs/ONS_population_projections.rds
  - 02_parameters:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        vaccine_dependencies/base.rds: parameters_base.rds
  - 05_combine_vaccinations:
      id: latest(parameter:assumptions == assumptions && parameter:param_iterations == 200 && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        vaccine_dependencies/vaccine_simulations.rds: combined_vaccination_dataframe.rds
        vaccine_dependencies/vaccine_schedules.rds: vaccine_schedules.rds
  - 05_combine_vaccinations:
      id: latest(parameter:assumptions == assumptions && parameter:param_iterations == 200 && parameter:deterministic == deterministic && parameter:population_assumptions == "rtm_baseline" && parameter:population_year == 2019 && parameter:vaccine_assumptions == "baseline")
      use:
        vaccine_dependencies/baseline_vaccine_simulations.rds: combined_vaccination_dataframe.rds
        vaccine_dependencies/baseline_vaccine_schedules.rds: vaccine_schedules.rds
