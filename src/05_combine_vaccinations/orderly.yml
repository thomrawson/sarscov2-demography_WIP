script: script.R

parameters:
    deterministic:
      default: false
    assumptions:
      default: "central"
    population_assumptions:
      default: "ONS_NHS_region_principal"
    population_year:
      default: 2019
    vaccine_assumptions:
      default: "baseline"
    param_iterations:
      default: 100

artefacts:
## The outcome of the combine task.

  - data:
      description: PMCMC results for combined task
      filenames:
        - combined_vaccination_dataframe.rds
        - vaccine_schedules.rds

global_resources:
  global_util.R: rtm_inference/util_new.R

# sources:
#   - data.R
  
packages:
  - sircovid
  - spimalot
  - tidyr

depends:
  - 03_simulations:
     id: latest(parameter:region == "east_of_england" && parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
     use:
        regional_vaccinations/east_of_england_vaccinations.rds: outputs/vaccine_simulations.rds
  - 03_simulations:
     id: latest(parameter:region == "london" && parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
     use:
        regional_vaccinations/london_vaccinations.rds: outputs/vaccine_simulations.rds
  - 03_simulations:
     id: latest(parameter:region == "midlands" && parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
     use:
        regional_vaccinations/midlands_vaccinations.rds: outputs/vaccine_simulations.rds
  - 03_simulations:
     id: latest(parameter:region == "north_east_and_yorkshire" && parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
     use:
        regional_vaccinations/north_east_and_yorkshire_vaccinations.rds: outputs/vaccine_simulations.rds
  - 03_simulations:
     id: latest(parameter:region == "north_west" && parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
     use:
        regional_vaccinations/north_west_vaccinations.rds: outputs/vaccine_simulations.rds
  - 03_simulations:
     id: latest(parameter:region == "south_east" && parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
     use:
        regional_vaccinations/south_east_vaccinations.rds: outputs/vaccine_simulations.rds
  - 03_simulations:
     id: latest(parameter:region == "south_west" && parameter:assumptions == assumptions && parameter:param_iterations == param_iterations && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
     use:
        regional_vaccinations/south_west_vaccinations.rds: outputs/vaccine_simulations.rds
  - 02_parameters:
      id: latest(parameter:assumptions == assumptions && parameter:deterministic == deterministic && parameter:population_assumptions == population_assumptions && parameter:population_year == population_year && parameter:vaccine_assumptions == vaccine_assumptions)
      use:
        parameters/base.rds: parameters_base.rds